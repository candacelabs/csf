// Refinement annotations shared by Liquid Proto contracts.
//
// protoc-gen-liquidproto compiles these predicates into native Go checks and
// emits direct message validation boundaries.
syntax = "proto3";

package candace.liquid.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/candacelabs/csf/pkg/liquidproto/v1;liquidv1";

// FieldRefinement attaches predicates to a singular protobuf scalar or enum,
// independently to the keys and values of a string-keyed scalar map, or an
// explicit nested-message validation call.
message FieldRefinement {
  // Boolean expression over `this`, using comparisons, &&, ||, !, len(), and
  // matches().
  string expr = 1;
  // Boolean expression applied to every key in a string-keyed scalar map.
  string map_key_expr = 2;
  // Boolean expression applied to every value in a string-keyed scalar map.
  string map_value_expr = 3;
  // Calls the target message's generated validator when this singular message
  // field is present. It cannot be combined with expr or map predicates.
  bool recurse = 4;
}

extend google.protobuf.FieldOptions {
  // 51234 is retained from the research implementation. Changing it would
  // silently reinterpret existing descriptors, so it is part of the wire
  // contract.
  FieldRefinement field = 51234;
}
