[package]
name = "candace-csf-object-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[[bin]]
name = "object-storage"
path = "src/main.rs"

[dependencies]
aws-config = "1.8.8"
aws-credential-types = "1.2"
aws-sdk-s3 = { version = "1.100.0", default-features = false, features = ["rt-tokio", "rustls"] }
clap = { version = "4.6.6", features = ["derive"] }
http = "0.2"
libc = "0.2.189"
shlex = "2.0.1"
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
thiserror = "2.0.20"

[dev-dependencies]
aws-smithy-runtime-api = { version = "1.11.5", features = ["http-1x"] }
aws-smithy-types = "1.4.5"
