[package]
name = "candace-csf"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[[bin]]
name = "candace"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive"] }
getrandom = "=0.3.4"
libc = "=0.2.189"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.151"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
