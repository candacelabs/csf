[package]
name = "csf-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

# The per-session launcher: confines one harness session's turn executor to a
# cgroup, a Landlock filesystem view, and a seccomp syscall policy, then execs
# the executor. It is an argv prefix the harness places in front of the
# executor command through ipc/proc.
[[bin]]
name = "csf-session-launcher"
path = "src/bin/launcher.rs"

# The per-session Docker proxy: a Unix socket the session's DOCKER_HOST points
# at, forwarding a fixed allow-list of Engine API calls to the real socket and
# refusing everything that would widen the session's authority.
[[bin]]
name = "csf-docker-proxy"
path = "src/bin/docker_proxy.rs"

[lib]
name = "csf_sandbox"
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
nix = { version = "=0.29.0", features = ["process"] }
landlock = "=0.4.7"
seccompiler = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
httparse = "=1.10.1"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "macros"] }

[dev-dependencies]
tempfile = "=3.27.0"
