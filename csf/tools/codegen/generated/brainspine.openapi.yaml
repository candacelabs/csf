      "candace.harness.v1.Ruling": {
        "type": "object",
        "description": "One operator ruling: what it decides, the operator's own words, whom it\nbinds, why, and the gate that enforces it. A ruling no gate enforces is\nUNENFORCED, and the Workbench and the rulings view flag it. An agent\nquestion, or an alternative it offers, that names an excluded alternative\nre-litigates the ruling, and the question gate refuses it.",
        "properties": {
          "enforcedBy": {
            "type": "string",
            "description": "The gate that enforces the ruling; empty is UNENFORCED."
          },
          "excludes": {
            "type": "array",
            "description": "Phrases naming the alternatives the ruling rules out, matched word by\nword after stemming; none blank (the service checks). A ruling with none\nis never matched by the question gate.",
            "items": {
              "type": "string"
            }
          },
          "pendingGate": {
            "type": "string",
            "description": "The gate that will enforce the ruling once it merges. The ruling stays\nUNENFORCED until enforced_by names a gate."
          },
          "quote": {
            "type": "string",
            "description": "The operator's words, copied verbatim and never paraphrased."
          },
          "ruledOn": {
            "type": "string",
            "description": "The day the operator ruled, as YYYY-MM-DD."
          },
          "rulingId": {
            "type": "string"
          },
          "scope": {
            "type": "string",
            "description": "Whom the ruling binds: every actor, the sessions, the orchestrator."
          },
          "statement": {
            "type": "string"
          },
          "supersedes": {
            "type": "string",
            "description": "The ruling this one replaces; it stops being in force."
          },
          "why": {
            "type": "string",
            "description": "Why the operator ruled: what happened that the ruling answers."
          }
        }
