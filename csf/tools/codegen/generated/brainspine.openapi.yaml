                    "type": "boolean",
                    "description": "The message is the operator's own words: a chat turn the operator sent,\nor a relayed message that quotes the operator verbatim. The harness\ncomputes the message's unvetted terms, records them as an event and puts\nthem into the turn, and the reply gate holds the reply to them."
                  },
                  "priorityClass": {
                    "$ref": "#/components/schemas/candace.harness.v1.MessagePriorityClass",
                    "description": "priority_class determines if message interrupts running turn or queues normally."
                  },
                  "questionWanted": {
                    "type": "boolean",
                    "description": "The operator wanted the question the question gate last refused in this\nsession: the send is recorded as an override, the false-positive\nevidence for the gate's classifier."
                  }
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "default": {
            "description": "An unexpected error response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/google.rpc.Status"
                }
              }
            }
          },
          "200": {
            "description": "A turn identifier acknowledges that the message was queued for the\nsession's next safepoint; it does not prove the turn ran or succeeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/candace.harness.v1.SendAgentSessionMessageResponse"
                }
              }
            }
          }
        }
      }
    },
