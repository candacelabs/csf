  "components": {
    "schemas": {
      "candace.brainspine.v1.AgentAssignmentPlan": {
        "type": "object",
        "description": "A prepared recipe is inspectable data, not a dispatched or completed task.\nFingerprints bind evidence to the exact definition and complete recipe.",
        "properties": {
          "definitionSha256": {
            "type": "string"
          },
          "promptKey": {
            "type": "string"
          },
          "recipe": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentAssignmentRecipe"
          },
          "recipeSha256": {
            "type": "string"
          },
          "sessionKey": {
            "type": "string"
          }
        }
      },
      "candace.brainspine.v1.AgentAssignmentReceipt": {
        "type": "object",
        "description": "The consumer retains session links even if prompt acceptance is unconfirmed:\nan empty turn_id identifies a partial receipt. A populated turn_id records\nacknowledged acceptance, not successful completion of the turn or its task.",
        "properties": {
          "branch": {
            "type": "string",
            "description": "For a harness run: the work branch, the draft pull request the commit\ngate opened (empty when none exists yet) and the run's trace."
          },
          "executor": {
            "type": "string",
            "description": "The turn executor the session ran on, as the recipe names it; never empty\nfor a harness run."
          },
          "plan": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentAssignmentPlan"
          },
          "pullRequestUrl": {
            "type": "string"
          },
          "resumed": {
            "$ref": "#/components/schemas/candace.brainspine.v1.ResumedTurn",
            "description": "Set on the first turn after the session hypervisor resumed a suspended\nsession, so the cost of resuming is on the receipt."
          },
          "sessionId": {
            "type": "string"
          },
          "sessionUrl": {
            "type": "string"
          },
          "traceId": {
            "type": "string"
          },
          "turnId": {
            "type": "string"
          },
          "worktreeId": {
            "type": "string"
          }
        }
      },
      "candace.brainspine.v1.AgentAssignmentRecipe": {
        "type": "object",
        "description": "One immutable assignment recipe. Retain this file to retry the assignment;\nchanging its contents requires a new assignment_id. Model and repository\nidentifiers come from the Workbench catalog. This slice creates a worktree.",
        "properties": {
          "agent": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentDefinition"
          },
          "assignmentId": {
            "type": "string"
          },
          "executor": {
            "type": "string",
            "description": "The turn executor a harness session runs on: \"claude-code\" (also when\nempty) runs Claude Code and \"copilot\" runs the GitHub Copilot CLI. The\nmodel is passed to the chosen executor unchanged, so it is spelled as that\nexecutor spells it."
          },
          "model": {
            "type": "string"
          },
          "repositoryId": {
            "type": "string"
          },
          "task": {
            "type": "string"
          },
          "ticketUrl": {
            "type": "string"
          },
          "workspace": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentWorkspace",
            "description": "Present when the harness runs the assignment itself as a Claude Code\nsession; absent for a Workbench submission. Set only fields change the\nrecipe fingerprint, so recipes without a workspace keep their hashes."
          }
        }
      },
      "candace.brainspine.v1.AgentConfiguration": {
        "type": "object",
        "description": "Durable configuration receipt. It contains references only, never secret\nvalues. revision implements compare-and-swap updates.",
        "properties": {
          "agentId": {
            "type": "string"
          },
          "langfuse": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentLangfuseConfiguration"
          },
          "opensearch": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentOpenSearchConfiguration"
          },
          "revision": {
            "type": "integer",
            "format": "int64"
          },
          "updatedAt": {
            "type": "string"
          }
        }
      },
      "candace.brainspine.v1.AgentConfigurationInput": {
        "type": "object",
        "description": "A complete replacement payload for one agent's external-tool configuration.\nThe authenticated transport selects the agent; callers cannot supply an ID.",
        "properties": {
          "langfuse": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentLangfuseConfiguration"
          },
          "opensearch": {
            "$ref": "#/components/schemas/candace.brainspine.v1.AgentOpenSearchConfiguration"
          }
        }
      },
      "candace.brainspine.v1.AgentDefinition": {
        "type": "object",
        "description": "Reusable worker configuration. Instructions guide the backend; they do not\ngrant permissions. The host retains its existing tool approval policy.",
        "properties": {
          "displayName": {
            "type": "string"
          },
          "id": {
            "type": "string"
          },
          "instructions": {
            "type": "string"
          },
          "revision": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "candace.brainspine.v1.AgentLangfuseConfiguration": {
        "type": "object",
        "description": "Agent-owned references for Langfuse. Secret material remains in the\noperator-owned secret store; agents can only inspect and select their own\nopaque references.",
        "properties": {
          "endpointUrl": {
            "type": "string"
          },
          "publicKeySecretRef": {
            "type": "string"
          },
          "secretKeySecretRef": {
            "type": "string"
          }
        }
      },
      "candace.brainspine.v1.AgentOpenSearchConfiguration": {
        "type": "object",
        "description": "Agent-owned references for the rebuildable OpenSearch projection. The\nevidence authority remains PostgreSQL and the artifact store.",
        "properties": {
          "credentialsSecretRef": {
            "type": "string"
          },
          "embeddingModel": {
            "type": "string"
          },
          "endpointUrl": {
            "type": "string"
          },
          "index": {
            "type": "string"
          }
        }
      },
      "candace.brainspine.v1.AgentWorkspace": {
        "type": "object",
        "description": "Where and how the harness runs an assignment: a git worktree it creates\nfrom a local repository on a branch of its own, the tools the session may\nuse, and the title of the draft pull request the commit gate opens.",
        "properties": {
          "allowedTools": {
            "type": "array",
            "description": "Claude Code tool rules the session may use without asking, such as\n\"Bash\", \"Edit\" or \"Bash(git *)\". Everything else is denied. A Copilot\nsession runs the same rules translated to Copilot's tools; a rule with\nno Copilot equivalent refuses the recipe.",
            "items": {
              "type": "string"
            }
          },
          "baseBranch": {
            "type": "string",
            "description": "The ref the work branch starts from and the pull request targets."
          },
          "branch": {
            "type": "string",
            "description": "The work branch the worktree checks out; created from base_branch."
          },
          "briefPath": {
            "type": "string",
            "description": "A file holding the task, read by the launcher in place of an inline\ntask; relative paths resolve against the recipe file."
          },
          "mode": {
            "type": "string",
            "description": "Workspace mode: \"normal\" (default) or \"patch\" for submit-then-verify flow."
          },
          "pullRequestTitle": {
            "type": "string",
            "description": "Title of the draft pull request opened after the first commit."
          },
          "repositoryPath": {
            "type": "string",
            "description": "Absolute path of the local repository the worktree is created from."
          }
        }
      },
      "candace.brainspine.v1.ArtifactEvidence": {
        "type": "object",
        "properties": {
          "bytes": {
            "type": "string",
            "format": "uint64"
          },
          "missing": {
            "type": "boolean"
          },
          "path": {
            "type": "string"
          },
          "sha256": {
            "type": "string"
          }
        }
      },
      "candace.brainspine.v1.AuthorKind": {
        "type": "string",
        "enum": [
          "AUTHOR_KIND_UNSPECIFIED",
          "AUTHOR_KIND_SOURCE",
          "AUTHOR_KIND_MODEL",
          "AUTHOR_KIND_OPERATOR",
          "AUTHOR_KIND_CHECKER"
        ]
      },
      "candace.brainspine.v1.CancelSimulationResponse": {
        "type": "object",
        "properties": {
          "run": {
            "$ref": "#/components/schemas/candace.brainspine.v1.SimulationRun"
          }
        }
      },
      "candace.brainspine.v1.CommandReceipt": {
        "type": "object",
        "description": "Command execution evidence is generated into every consumer. Success means\nthe recorded command exited zero; it does not prove an arbitrary claim.",
        "properties": {
          "branch": {
            "type": "string"
          },
          "claim": {
