name: CSF compiler

# Hosted checks belong to the public repository. Private staging receives the
# canonical runner results and exact snapshot/consumer acceptance evidence.
on:
  pull_request:
    paths: ['csf/compiler/**', 'csf/editor/**', 'csf/examples/proof/**', 'tools/bazel.sh', 'MODULE.bazel', 'MODULE.bazel.lock', 'BUILD.bazel', '.bazelrc', '.bazelversion', '.gitattributes', '.github/actions/ocaml-toolchain/**', '.github/workflows/csfc.yml']
  # No path filter on push: the check-generated step reads the census of the whole tracked tree, so any file can
  # change its verdict, and a filter that skips those files is green by never looking.
  push:
    branches: [main, candace-export, 'release/**']

permissions:
  contents: read

concurrency:
  group: csfc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opam-repository-prepare:
    if: ${{ (github.event.repository.private == false || startsWith(github.base_ref || github.ref_name, 'release/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize the pinned opam repository
        uses: ./.github/actions/ocaml-toolchain
        with:
          mode: repository

  ocaml-bytecode-prepare:
    needs: opam-repository-prepare
    if: ${{ (github.event.repository.private == false || startsWith(github.base_ref || github.ref_name, 'release/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the OCaml bytecode bootstrap
        uses: ./.github/actions/ocaml-toolchain
        with:
          mode: bytecode

  ocaml-compiler-prepare:
    needs: ocaml-bytecode-prepare
    if: ${{ (github.event.repository.private == false || startsWith(github.base_ref || github.ref_name, 'release/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the exact OCaml base compiler
        uses: ./.github/actions/ocaml-toolchain
        with:
          mode: compiler

  ocaml-toolchain-prepare:
    needs: ocaml-compiler-prepare
    if: ${{ (github.event.repository.private == false || startsWith(github.base_ref || github.ref_name, 'release/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the exact validated OCaml installation
        uses: ./.github/actions/ocaml-toolchain
        with:
          mode: prepare

  compiler:
    needs: ocaml-toolchain-prepare
    if: ${{ (github.event.repository.private == false || startsWith(github.base_ref || github.ref_name, 'release/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # operator ruling 2026-10-06: relax gates that stand between us and 100%; a cold build with the goldens took 5m08s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore the exact validated OCaml installation
        uses: ./.github/actions/ocaml-toolchain
      - name: Build and test csfc
        env:
          # The exported repository's MODULE.bazel is at its root. The
          # compiler is a package below that module, not a nested workspace.
          CANDACE_BAZEL_WORKSPACE: ${{ github.workspace }}
        run: >-
          bash tools/bazel.sh test //csf/compiler/...
          --lockfile_mode=error --test_output=errors --nobuild_tests_only
      - name: Check the shipped compiler example
        run: bazel-bin/csf/compiler/bin/csfc check-generated

  proof:
    if: ${{ (github.event.repository.private == false || startsWith(github.base_ref || github.ref_name, 'release/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Bootstrap the pinned Lean and check both proofs
        run: |
          bash csf/examples/proof/check.sh
          bash csf/compiler/verification/check.sh
