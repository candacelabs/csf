name: Prepare or restore Bazel runtime dependencies
description: Split cold Go and Rust dependency compilation from complete target checks, using only content-addressed caches.

inputs:
  stage:
    description: go, rust-base, rust-network, rust-support, or rust-deps
    required: true
  mode:
    description: prepare builds a missing stage; restore requires its successful preparation.
    default: restore

runs:
  using: composite
  steps:
    - name: Identify the pinned dependency graph
      id: key
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        STAGE: ${{ inputs.stage }}
        MODE: ${{ inputs.mode }}
      run: |
        set -Eeuo pipefail
        case "$STAGE" in go|rust-base|rust-network|rust-support|rust-deps) ;; *) exit 2 ;; esac
        case "$STAGE" in
          rust-network) printf 'previous=rust-base\n' >> "$GITHUB_OUTPUT" ;;
          rust-support) printf 'previous=rust-network\n' >> "$GITHUB_OUTPUT" ;;
          rust-deps) printf 'previous=rust-support\n' >> "$GITHUB_OUTPUT" ;;
        esac
        case "$MODE" in prepare|restore) ;; *) exit 2 ;; esac
        graph="$(bash "$ACTION_ROOT/key.sh")"
        base_key="csf-bazel-runtime-v2-${RUNNER_OS}-${RUNNER_ARCH}-${STAGE}-${graph}"
        save_key="${base_key}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        printf 'value=%s\n' "$graph" >> "$GITHUB_OUTPUT"
        printf 'base-key=%s\n' "$base_key" >> "$GITHUB_OUTPUT"
        printf 'save-key=%s\n' "$save_key" >> "$GITHUB_OUTPUT"
        printf 'CANDACE_BAZEL_CACHE=%s/.git/csf-bazel-runtime\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        printf 'CANDACE_BAZEL_DISK_CACHE=/bazel-home/sharedtaskcache\n' >> "$GITHUB_ENV"

    # Keep the literal paths identical in every job. Output bases, extracted
    # repositories, symlinks, and test verdicts are never transferred.
    - name: Restore successfully prepared content
      id: restore
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .git/csf-bazel-runtime/output/cache/repos/v1/
          .git/csf-bazel-runtime/home/sharedtaskcache/
          .git/csf-bazel-runtime/completed.json
        key: ${{ steps.key.outputs.base-key }}
        # Preparation may restore the newest completed entry for this exact
        # dependency graph. The receipt validator below rejects incomplete or
        # mismatched entries before either preparation or consumption proceeds.
        restore-keys: ${{ steps.key.outputs.base-key }}-
        fail-on-cache-miss: ${{ inputs.mode == 'restore' }}

    - name: Require a completed matching dependency graph
      id: completed
      if: inputs.mode == 'restore' || steps.restore.outputs.cache-matched-key != ''
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        EXPECTED_STAGE: ${{ inputs.stage }}
        EXPECTED_GRAPH: ${{ steps.key.outputs.value }}
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        VALIDATION_MODE: ${{ inputs.mode }}
      run: python3 "$ACTION_ROOT/verify.py"

    - name: Require the preceding Rust preparation
      id: previous
      if: inputs.mode == 'prepare' && steps.key.outputs.previous != '' && steps.completed.outputs.valid != 'true'
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .git/csf-bazel-runtime/output/cache/repos/v1/
          .git/csf-bazel-runtime/home/sharedtaskcache/
          .git/csf-bazel-runtime/completed.json
        key: csf-bazel-runtime-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.previous }}-${{ steps.key.outputs.value }}
        restore-keys: csf-bazel-runtime-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.previous }}-${{ steps.key.outputs.value }}-
        fail-on-cache-miss: true

    - name: Validate the preceding Rust preparation
      if: inputs.mode == 'prepare' && steps.key.outputs.previous != '' && steps.completed.outputs.valid != 'true'
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        EXPECTED_STAGE: ${{ steps.key.outputs.previous }}
        EXPECTED_GRAPH: ${{ steps.key.outputs.value }}
        MATCHED_KEY: ${{ steps.previous.outputs.cache-matched-key }}
        VALIDATION_MODE: restore
      run: python3 "$ACTION_ROOT/verify.py"

    - name: Compile the pinned preparation targets
      if: inputs.mode == 'prepare' && steps.completed.outputs.valid != 'true'
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        STAGE: ${{ inputs.stage }}
      run: bash "$ACTION_ROOT/prepare.sh" "$STAGE"

    - name: Record the completed dependency graph
      if: inputs.mode == 'prepare' && steps.completed.outputs.valid != 'true'
      shell: bash
      env:
        EXPECTED_STAGE: ${{ inputs.stage }}
        EXPECTED_GRAPH: ${{ steps.key.outputs.value }}
        SAVE_KEY: ${{ steps.key.outputs.save-key }}
        RECEIPT: ${{ github.workspace }}/.git/csf-bazel-runtime/completed.json
      run: |
        set -Eeuo pipefail
        python3 - "$RECEIPT" <<'PY'
        import json
        import os
        import sys
        from pathlib import Path
        path = Path(sys.argv[1])
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(json.dumps({
            "stage": os.environ["EXPECTED_STAGE"],
            "graph": os.environ["EXPECTED_GRAPH"],
            "cache_key": os.environ["SAVE_KEY"],
        }) + "\n")
        PY

    - name: Save only a successful preparation
      if: inputs.mode == 'prepare' && steps.completed.outputs.valid != 'true'
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .git/csf-bazel-runtime/output/cache/repos/v1/
          .git/csf-bazel-runtime/home/sharedtaskcache/
          .git/csf-bazel-runtime/completed.json
        key: ${{ steps.key.outputs.save-key }}

    # Cache save can warn when an immutable reservation is abandoned or won by
    # another preparation. Do not let that warning make the next stage believe
    # an exact dependency graph is available.
    - name: Confirm the successful preparation was saved
      if: inputs.mode == 'prepare' && steps.completed.outputs.valid != 'true'
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          .git/csf-bazel-runtime/output/cache/repos/v1/
          .git/csf-bazel-runtime/home/sharedtaskcache/
          .git/csf-bazel-runtime/completed.json
        key: ${{ steps.key.outputs.save-key }}
        lookup-only: true
        fail-on-cache-miss: true
