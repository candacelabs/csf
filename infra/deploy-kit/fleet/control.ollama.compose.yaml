services:
  core:
    environment:
      DEPLOY_HARNESS_BACKEND: ollama
      DEPLOY_OLLAMA_URL: ${DEPLOY_OLLAMA_URL:?fleet environment is incomplete}
      DEPLOY_OLLAMA_MODEL: ${DEPLOY_OLLAMA_MODEL:?fleet environment is incomplete}
      DEPLOY_OLLAMA_MODEL_DIGEST: ${DEPLOY_OLLAMA_MODEL_DIGEST:?fleet environment is incomplete}
      DEPLOY_OLLAMA_CONTEXT_TOKENS: ${DEPLOY_OLLAMA_CONTEXT_TOKENS:-16384}
      DEPLOY_OLLAMA_MAX_TOOL_CALLS: ${DEPLOY_OLLAMA_MAX_TOOL_CALLS:-16}
      DEPLOY_OLLAMA_TURN_TIMEOUT: ${DEPLOY_OLLAMA_TURN_TIMEOUT:-10m}
