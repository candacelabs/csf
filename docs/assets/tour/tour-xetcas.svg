    .bad-head { fill: #B91C1C; }
    .life { fill: none; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .tag-a { fill: #0F766E; }
    .tag-b { fill: #4338CA; }
    .tag-c { fill: #475569; }
    .reserved { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .tag-n { fill: #334155; }
    .own-csf { fill: #F0FDFA; stroke: #0F766E; stroke-width: 2.5; }
    .own-go { fill: #EEF2FF; stroke: #4338CA; stroke-width: 2; }
    .own-you { fill: #FFFBEB; stroke: #B45309; stroke-width: 2; }
    .own-hw { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
    .strip-you { fill: #FEF3C7; stroke: #B45309; stroke-width: 1; }
    .go-dot { fill: #4338CA; }
    .gowire { fill: none; stroke: #4338CA; stroke-width: 2; }
    .godash { fill: none; stroke: #4338CA; stroke-width: 2; stroke-dasharray: 6 4; }
    .go-head { fill: #4338CA; }
