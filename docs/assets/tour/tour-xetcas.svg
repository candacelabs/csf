  <defs>
    <marker id="wire-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wire-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="link-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="link-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="go-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="go-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="bad-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="bad-head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="420" rx="16"/>
  <text class="ink" x="24" y="36" font-size="20" font-weight="700">xetcas sends only the chunks that changed.</text>
  <text class="muted" x="24" y="58" font-size="13">Files are split into content-defined chunks, and each chunk is stored once.</text>
  <text class="ink" x="24" y="116" font-size="14" font-weight="700">model v1 · 48 MiB</text>
  <text class="muted" x="24" y="134" font-size="12">first push</text>
  <text class="ink" x="24" y="226" font-size="14" font-weight="700">model v2 · 2% edited</text>
  <text class="muted" x="24" y="244" font-size="12">second push</text>
  <rect class="newchunk" x="220" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="260" y="124" font-size="15" font-weight="700" text-anchor="middle">A</text>
  <rect class="stored" x="220" y="206" width="80" height="46" rx="8"/>
  <text class="muted" x="260" y="234" font-size="15" font-weight="700" text-anchor="middle">A</text>
  <rect class="newchunk" x="306" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="346" y="124" font-size="15" font-weight="700" text-anchor="middle">B</text>
  <rect class="stored" x="306" y="206" width="80" height="46" rx="8"/>
  <text class="muted" x="346" y="234" font-size="15" font-weight="700" text-anchor="middle">B</text>
  <rect class="newchunk" x="392" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="432" y="124" font-size="15" font-weight="700" text-anchor="middle">C</text>
  <rect class="stored" x="392" y="206" width="80" height="46" rx="8"/>
  <text class="muted" x="432" y="234" font-size="15" font-weight="700" text-anchor="middle">C</text>
  <rect class="newchunk" x="478" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="518" y="124" font-size="15" font-weight="700" text-anchor="middle">D</text>
  <rect class="changed" x="478" y="206" width="80" height="46" rx="8"/>
  <text class="chip-text" x="518" y="234" font-size="15" font-weight="700" text-anchor="middle">D′</text>
  <rect class="newchunk" x="564" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="604" y="124" font-size="15" font-weight="700" text-anchor="middle">E</text>
  <rect class="stored" x="564" y="206" width="80" height="46" rx="8"/>
  <text class="muted" x="604" y="234" font-size="15" font-weight="700" text-anchor="middle">E</text>
  <rect class="newchunk" x="650" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="690" y="124" font-size="15" font-weight="700" text-anchor="middle">F</text>
  <rect class="stored" x="650" y="206" width="80" height="46" rx="8"/>
  <text class="muted" x="690" y="234" font-size="15" font-weight="700" text-anchor="middle">F</text>
  <rect class="newchunk" x="736" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="776" y="124" font-size="15" font-weight="700" text-anchor="middle">G</text>
  <rect class="stored" x="736" y="206" width="80" height="46" rx="8"/>
  <text class="muted" x="776" y="234" font-size="15" font-weight="700" text-anchor="middle">G</text>
  <rect class="newchunk" x="822" y="96" width="80" height="46" rx="8"/>
  <text class="chip-text" x="862" y="124" font-size="15" font-weight="700" text-anchor="middle">H</text>
  <rect class="stored" x="822" y="206" width="80" height="46" rx="8"/>
  <text class="muted" x="862" y="234" font-size="15" font-weight="700" text-anchor="middle">H</text>
  <path class="process" d="M420,312 L420,384 A110.0,12 0 0 0 640,384 L640,312 A110.0,12 0 0 0 420,312 Z"/>
  <ellipse class="process" cx="530.0" cy="312" rx="110.0" ry="12"/>
  <text class="ink" x="530.0" y="350.0" font-size="14" font-weight="700" text-anchor="middle">xetcas</text>
  <text class="muted" x="530.0" y="369.0" font-size="12.5" text-anchor="middle">each chunk stored once</text>
  <path class="link" d="M518,252 L518,296" marker-end="url(#link-end)"/>
  <text class="accent" x="532" y="280" font-size="12" font-weight="700">only D′ is sent: about 1 MiB</text>
  <rect class="bad" x="700" y="312" width="276" height="70" rx="10"/>
  <text class="ink" x="838.0" y="343.0" font-size="14" font-weight="700" text-anchor="middle">plain Git LFS</text>
  <text class="muted" x="838.0" y="362.0" font-size="12.5" text-anchor="middle">re-uploads all 48 MiB</text>
  <rect class="newchunk" x="24" y="300" width="18" height="18" rx="4"/>
  <text class="muted" x="50" y="314" font-size="12.5">new chunk, uploaded</text>
  <rect class="changed" x="24" y="326" width="18" height="18" rx="4"/>
  <text class="muted" x="50" y="340" font-size="12.5">changed chunk, uploaded</text>
  <rect class="stored" x="24" y="352" width="18" height="18" rx="4"/>
  <text class="muted" x="50" y="366" font-size="12.5">already stored, skipped</text>
</svg>
