<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title description">
  <title id="title">Why xetcas uploads so little</title>
  <desc id="description">Model v1, 48 MiB, is split into chunks A to H, all uploaded on the first push. Model v2 has 2% edited, which changes only chunk D into D prime. On the second push only D prime, about 1 MiB, is sent to xetcas, which stores each chunk once. Plain Git LFS would re-upload all 48 MiB.</desc>
