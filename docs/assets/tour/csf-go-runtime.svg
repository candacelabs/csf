  <rect class="bg" x="0" y="0" width="1000" height="996" rx="16"/>
  <text class="ink" x="24" y="36" font-size="20" font-weight="700">Monolithic microservices: who owns what, from your code down to the cores.</text>
  <text class="muted" x="24" y="58" font-size="13">Color shows ownership. Each service is a CSF part (teal) with the piece you supply (amber), running on the Go runtime (indigo).</text>
