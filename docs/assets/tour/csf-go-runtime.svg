<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 996" width="1000" height="996" role="img" aria-labelledby="title description">
  <title id="title">Monolithic microservices: who owns what</title>
  <desc id="description">Colors mark ownership: teal is CSF, indigo is the Go runtime, amber is you, the consumer, and grey is the machine. Top band, your process: six services built from CSF parts, each split into what CSF does and what you supply: the scheduler (CSF fires jobs, you declare triggers), a task queue (CSF types the jobs, you write handlers), agent sessions (CSF runs them, you write the recipe and brief), gotth-live pages (CSF handles the WebSocket and patches, you write the page and reducer), an in-memory store (CSF provides stores and the mailbox owner, you supply data structures) and MCP tools (CSF serves MCP and checks schemas, you write handlers). Below them, what CSF expects from you: your main with its listener, TLS, authentication and shutdown; owning and cleaning up your goroutines; io only through granted capabilities; one owner per mutable value. Middle band, the Go runtime: one garbage-collected heap, processors P0 to P2 with queues of goroutines, and channels. Bottom band: OS threads the runtime manages, running on cores; on a LITHE robot CPU 1, 2 and 3 are reserved and CSF runs on CPU 0, 4 and 5.</desc>
