  <text class="muted" x="24" y="936" font-size="13">Indigo arrows are the runtime's channels and shared heap; the dashed one hands a value from a goroutine on P0 to one on P2.</text>
  <text class="muted" x="24" y="956" font-size="13">Services keep microservice boundaries, yet a handoff between them is a call or a channel, never a network hop.</text>
  <text class="muted" x="24" y="976" font-size="13">On a LITHE robot CPU 1 to 3 are reserved for real time, so CSF's process scales across every other core: here CPU 0, 4 and 5.</text>
</svg>
