  <text class="ink" x="210" y="94" font-size="13" font-weight="700">the Go runtime owns</text>
  <rect class="own-you" x="404" y="80" width="18" height="18" rx="4"/>
  <text class="ink" x="430" y="94" font-size="13" font-weight="700">you provide (the consumer)</text>
  <rect class="own-hw" x="654" y="80" width="18" height="18" rx="4"/>
  <text class="ink" x="680" y="94" font-size="13" font-weight="700">the machine</text>
