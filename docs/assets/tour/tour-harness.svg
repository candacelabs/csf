<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="title description">
  <title id="title">A harness session</title>
  <desc id="description">A typed recipe, agent.json, is submitted with csf submit to the harness, one per machine. The harness creates a git worktree and an agent session, steerable from a chat page. Every command and commit passes the session gate: allowed commands run; refused ones return the reason and what to do instead. The first commit opens a draft pull request, which merges only through the merge gate.</desc>
  <!-- Hand-drawn tour figure in the style of docs/assets/csf-cpu0-mapping.svg; not generated from architecture.csf. -->
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #FFFFFF; }
    .ink { fill: #0F172A; }
    .muted { fill: #475569; }
    .accent { fill: #115E59; }
    .panel { fill: #EEF2FF; stroke: #4338CA; stroke-width: 2; }
    .card { fill: #FFFFFF; stroke: #64748B; stroke-width: 1.5; }
    .process { fill: #FFFFFF; stroke: #0F766E; stroke-width: 2.5; }
    .chip { fill: #0F766E; }
    .chip-text { fill: #FFFFFF; }
    .lithe { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
    .gate { fill: #FFFBEB; stroke: #B45309; stroke-width: 2; }
    .good { fill: #ECFDF5; stroke: #047857; stroke-width: 2; }
    .bad { fill: #FEF2F2; stroke: #B91C1C; stroke-width: 2; }
    .newchunk { fill: #0F766E; }
    .stored { fill: #E2E8F0; stroke: #94A3B8; stroke-width: 1; }
    .changed { fill: #D97706; }
    .wire { fill: none; stroke: #334155; stroke-width: 1.6; }
    .wire-head { fill: #334155; }
    .link { fill: none; stroke: #0F766E; stroke-width: 2; }
    .link-head { fill: #0F766E; }
    .dash { fill: none; stroke: #0F766E; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .badwire { fill: none; stroke: #B91C1C; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .bad-head { fill: #B91C1C; }
    .life { fill: none; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .tag-a { fill: #0F766E; }
    .tag-b { fill: #4338CA; }
    .tag-c { fill: #475569; }
    .reserved { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .tag-n { fill: #334155; }
    .own-csf { fill: #F0FDFA; stroke: #0F766E; stroke-width: 2.5; }
    .own-go { fill: #EEF2FF; stroke: #4338CA; stroke-width: 2; }
    .own-you { fill: #FFFBEB; stroke: #B45309; stroke-width: 2; }
    .own-hw { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
    .strip-you { fill: #FEF3C7; stroke: #B45309; stroke-width: 1; }
    .go-dot { fill: #4338CA; }
    .gowire { fill: none; stroke: #4338CA; stroke-width: 2; }
    .godash { fill: none; stroke: #4338CA; stroke-width: 2; stroke-dasharray: 6 4; }
    .go-head { fill: #4338CA; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1117; }
      .ink { fill: #E6EDF3; }
      .muted { fill: #9DA7B3; }
      .accent { fill: #5EEAD4; }
      .panel { fill: #1E1B4B; stroke: #818CF8; }
      .card { fill: #0D1117; stroke: #8B949E; }
      .process { fill: #0D1117; stroke: #2DD4BF; }
      .chip { fill: #115E59; }
      .lithe { fill: #161B22; stroke: #8B949E; }
      .gate { fill: #1F1A0E; stroke: #F59E0B; }
      .good { fill: #0B2018; stroke: #34D399; }
      .bad { fill: #2A1215; stroke: #F87171; }
      .newchunk { fill: #14B8A6; }
      .stored { fill: #21262D; stroke: #484F58; }
      .changed { fill: #F59E0B; }
      .wire { stroke: #9DA7B3; }
      .wire-head { fill: #9DA7B3; }
      .link { stroke: #2DD4BF; }
      .link-head { fill: #2DD4BF; }
      .dash { stroke: #2DD4BF; }
      .badwire { stroke: #F87171; }
      .bad-head { fill: #F87171; }
      .life { stroke: #484F58; }
      .tag-a { fill: #115E59; }
      .tag-b { fill: #3730A3; }
      .tag-c { fill: #30363D; }
      .reserved { fill: #161B22; stroke: #484F58; }
      .band { fill: #0D1117; stroke: #30363D; }
      .tag-n { fill: #30363D; }
      .own-csf { fill: #0B1F1E; stroke: #2DD4BF; }
      .own-go { fill: #1E1B4B; stroke: #818CF8; }
      .own-you { fill: #1F1A0E; stroke: #F59E0B; }
      .own-hw { fill: #161B22; stroke: #8B949E; }
      .strip-you { fill: #3A2A08; stroke: #F59E0B; }
      .go-dot { fill: #6366F1; }
      .gowire { stroke: #818CF8; }
      .godash { stroke: #818CF8; }
      .go-head { fill: #818CF8; }
    }
  </style>
  <defs>
    <marker id="wire-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wire-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="link-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="link-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="go-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="go-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="bad-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="bad-head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="510" rx="16"/>
  <text class="ink" x="24" y="36" font-size="20" font-weight="700">The harness turns an AI agent into an engineer you can hand a ticket to.</text>
  <text class="muted" x="24" y="58" font-size="13">Every command passes a gate, every change arrives as a pull request, and you can steer any session from its chat page.</text>
  <rect class="card" x="24" y="110" width="160" height="70" rx="10"/>
  <text class="ink" x="104.0" y="141.0" font-size="14" font-weight="700" text-anchor="middle">agent.json</text>
  <text class="muted" x="104.0" y="160.0" font-size="12.5" text-anchor="middle">a typed recipe</text>
  <path class="link" d="M184,145 L248,145" marker-end="url(#link-end)"/>
  <text class="muted" x="216" y="137" font-size="11" text-anchor="middle">csf submit</text>
  <rect class="panel" x="250" y="80" width="460" height="300" rx="14"/>
  <text class="ink" x="270" y="106" font-size="15" font-weight="700">harness · one per machine</text>
  <rect class="card" x="275" y="125" width="180" height="60" rx="10"/>
  <text class="ink" x="365.0" y="151.0" font-size="14" font-weight="700" text-anchor="middle">git worktree</text>
  <text class="muted" x="365.0" y="170.0" font-size="12.5" text-anchor="middle">one per session</text>
  <rect class="process" x="490" y="125" width="190" height="60" rx="10"/>
  <text class="ink" x="585.0" y="151.0" font-size="14" font-weight="700" text-anchor="middle">agent session</text>
  <text class="muted" x="585.0" y="170.0" font-size="12.5" text-anchor="middle">an AI agent at work</text>
  <rect class="lithe" x="275" y="290" width="180" height="60" rx="10"/>
  <text class="ink" x="365.0" y="316.0" font-size="14" font-weight="700" text-anchor="middle">chat page</text>
  <text class="muted" x="365.0" y="335.0" font-size="12.5" text-anchor="middle">steer it from a browser</text>
  <path class="dash" d="M455,320 L470,320 L470,170 L488,170"/>
  <path class="wire" d="M585,185 L585,208" marker-end="url(#wire-end)"/>
  <polygon class="gate" points="585,210.0 660.0,255 585,300.0 510.0,255"/>
  <text class="ink" x="585" y="244.0" font-size="13.5" font-weight="700" text-anchor="middle">session gate</text>
  <text class="muted" x="585" y="262.0" font-size="11.5" text-anchor="middle">every command</text>
  <text class="muted" x="585" y="277.0" font-size="11.5" text-anchor="middle">and commit</text>
  <rect class="good" x="760" y="195" width="216" height="52" rx="10"/>
  <text class="ink" x="868.0" y="225.0" font-size="14" font-weight="700" text-anchor="middle">runs</text>
  <rect class="bad" x="760" y="268" width="216" height="74" rx="10"/>
  <text class="ink" x="868.0" y="293.0" font-size="14" font-weight="700" text-anchor="middle">refused</text>
  <text class="muted" x="868.0" y="312.0" font-size="12.5" text-anchor="middle">the agent reads why</text>
  <text class="muted" x="868.0" y="328.0" font-size="12.5" text-anchor="middle">and what to do instead</text>
  <path class="link" d="M660,255 L700,255 L700,221 L758,221" marker-end="url(#link-end)"/>
  <path class="badwire" d="M660,262 L700,262 L700,305 L758,305" marker-end="url(#bad-end)"/>
  <rect class="card" x="250" y="420" width="200" height="64" rx="10"/>
  <text class="ink" x="350.0" y="448.0" font-size="14" font-weight="700" text-anchor="middle">draft pull request</text>
  <text class="muted" x="350.0" y="467.0" font-size="12.5" text-anchor="middle">opened at the first commit</text>
  <rect class="gate" x="510" y="420" width="200" height="64" rx="10"/>
  <text class="ink" x="610.0" y="448.0" font-size="14" font-weight="700" text-anchor="middle">merge gate</text>
  <text class="muted" x="610.0" y="467.0" font-size="12.5" text-anchor="middle">checks and architecture score</text>
  <rect class="good" x="770" y="420" width="206" height="64" rx="10"/>
  <text class="ink" x="873.0" y="456.0" font-size="14" font-weight="700" text-anchor="middle">merged</text>
  <path class="wire" d="M585,300 L585,400 L350,400 L350,418" marker-end="url(#wire-end)"/>
  <text class="muted" x="595" y="350" font-size="11">first commit</text>
  <path class="link" d="M450,452 L508,452" marker-end="url(#link-end)"/>
  <path class="link" d="M710,452 L768,452" marker-end="url(#link-end)"/>
</svg>
