  <text class="ink" x="24" y="36" font-size="20" font-weight="700">Everything in CSF is shaped for one job: middleware for a robot's CPU 0.</text>
  <text class="muted" x="24" y="58" font-size="13">Read clockwise from the top: declare, run, show, change, ship, learn, improve, evolve. All of it lives in one Go process.</text>
