<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 975" width="1000" height="975" role="img" aria-labelledby="title description">
  <title id="title">How CSF fits together on a robot's CPU 0</title>
  <desc id="description">Eight parts arranged clockwise around CPU 0, one Go process built on the pkg primitives. 1 declare: the languages and csfc say what the software is and check the code still matches. 2 run: the runtime library puts every CPU 0 capability in one Go process, with no IPC and typed tools over MCP. 3 show: gotth-live makes the robot's UI a web page anyone can use, with no client state, so many versions can be served on scarce compute. 4 change: the agent harness lets AI agents change the code in worktrees under gates. 5 ship: deploy and Warden roll versions out to the fleet, fenced against one view. 6 learn, planned: xetcas stores weights and data once so the robot can retrain itself. 7 improve: Ouroboros turns mistakes in the record into gates proven on history. 8 evolve: RRSI rewrites the agent harness and keeps only changes that beat noise on a held-out exam.</desc>
