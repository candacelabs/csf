  <text class="chip-text" x="500" y="580" font-size="11.5" text-anchor="middle">mailbox · telemetry</text>
  <text class="muted" x="24" y="941" font-size="12.5">Amber marks planned work. Each step feeds the next: what the robot runs, shows and ships becomes the record</text>
  <text class="muted" x="24" y="959" font-size="12.5">that Ouroboros mines for gates and RRSI uses to evolve the harness.</text>
