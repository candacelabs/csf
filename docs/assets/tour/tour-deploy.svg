  <rect class="bg" x="0" y="0" width="1000" height="450" rx="16"/>
  <text class="ink" x="24" y="36" font-size="20" font-weight="700">The agent proposes; something trusted executes, checked against one view of the fleet.</text>
  <text class="muted" x="24" y="58" font-size="13">Every change is fenced against Warden's view, so a node that lost leadership cannot keep writing.</text>
  <rect class="lithe" x="24" y="110" width="190" height="64" rx="10"/>
