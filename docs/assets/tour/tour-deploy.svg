<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-labelledby="title description">
  <title id="title">Deploying with an agent</title>
  <desc id="description">The agent harness proposes a change to the deploy service, which approves it and fences it against Warden's authoritative view before the node executor applies it to Compose applications. Warden runs leader election over a fixed set of peers and tracks liveness and incidents. The operator UI watches every change.</desc>
