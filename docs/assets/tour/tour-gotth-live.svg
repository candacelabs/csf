<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="title description">
  <title id="title">One click in gotth-live</title>
  <desc id="description">Three lifelines: Tab A, the Go process and Tab B. Tab A sends a click event over the WebSocket. The Go process runs the reducer once to compute the new state, then sends the re-rendered fragment to both tabs. The Go process holds the only copy of the state.</desc>
