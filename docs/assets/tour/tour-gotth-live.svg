  <rect class="bg" x="0" y="0" width="1000" height="440" rx="16"/>
  <text class="ink" x="24" y="36" font-size="20" font-weight="700">One click, two tabs: the state lives only in the Go process.</text>
  <text class="muted" x="24" y="58" font-size="13">The browser sends events; the server decides what they mean and repaints every tab.</text>
  <rect class="lithe" x="70" y="80" width="200" height="54" rx="10"/>
  <text class="ink" x="170.0" y="103.0" font-size="14" font-weight="700" text-anchor="middle">Tab A</text>
  <text class="muted" x="170.0" y="122.0" font-size="12.5" text-anchor="middle">a browser tab</text>
  <path class="life" d="M170,134 L170,390"/>
  <rect class="process" x="400" y="80" width="200" height="54" rx="10"/>
  <text class="ink" x="500.0" y="103.0" font-size="14" font-weight="700" text-anchor="middle">Go process</text>
  <text class="muted" x="500.0" y="122.0" font-size="12.5" text-anchor="middle">holds the state</text>
  <path class="life" d="M500,134 L500,390"/>
  <rect class="lithe" x="730" y="80" width="200" height="54" rx="10"/>
  <text class="ink" x="830.0" y="103.0" font-size="14" font-weight="700" text-anchor="middle">Tab B</text>
  <text class="muted" x="830.0" y="122.0" font-size="12.5" text-anchor="middle">another tab</text>
  <path class="life" d="M830,134 L830,390"/>
  <path class="link" d="M170,180 L496,180" marker-end="url(#link-end)"/>
  <text class="ink" x="333" y="172" font-size="12.5" text-anchor="middle">1 · click: event counter.increment over the WebSocket</text>
  <rect class="process" x="400" y="205" width="200" height="56" rx="10"/>
  <text class="ink" x="500.0" y="229.0" font-size="13" font-weight="700" text-anchor="middle">2 · Reducer(state, event)</text>
  <text class="muted" x="500.0" y="248.0" font-size="12.5" text-anchor="middle">computes the new state once</text>
  <path class="wire" d="M500,300 L174,300" marker-end="url(#wire-end)"/>
  <text class="ink" x="337" y="292" font-size="12.5" text-anchor="middle">3 · re-rendered fragment</text>
  <path class="wire" d="M500,300 L826,300" marker-end="url(#wire-end)"/>
  <text class="ink" x="663" y="292" font-size="12.5" text-anchor="middle">3 · re-rendered fragment</text>
  <rect class="chip" x="400" y="340" width="200" height="22" rx="11"/>
  <text class="chip-text" x="500.0" y="355.5" font-size="12" font-weight="700" text-anchor="middle">the only copy of the state</text>
  <text class="muted" x="24" y="418" font-size="13">Neither tab keeps a copy, so they cannot disagree, and a reload shows the same count.</text>
</svg>
