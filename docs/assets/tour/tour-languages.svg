<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-labelledby="title description">
  <title id="title">The two CSF languages</title>
  <desc id="description">Two EBNF grammars define the vocabulary language and the composition language. architecture.csf and csf/architecture/architecture.csf are written in them. The compiler csfc reads both with the Go source and outputs a check result and generated documentation.</desc>
