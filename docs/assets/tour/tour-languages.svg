  <rect class="bg" x="0" y="0" width="1000" height="450" rx="16"/>
  <text class="ink" x="24" y="36" font-size="20" font-weight="700">Two small languages describe CSF; csfc checks the code against both.</text>
  <text class="muted" x="24" y="58" font-size="13">Each grammar defines a language, each .csf file is written in one, and the compiler reads them with the Go source.</text>
  <text class="muted" x="24" y="98" font-size="11.5" font-weight="700">GRAMMARS · EBNF</text>
  <text class="muted" x="270" y="98" font-size="11.5" font-weight="700">WRITTEN IN THEM</text>
  <text class="muted" x="600" y="98" font-size="11.5" font-weight="700">COMPILER</text>
  <text class="muted" x="760" y="98" font-size="11.5" font-weight="700">OUTPUT</text>
  <rect class="panel" x="24" y="110" width="200" height="70" rx="10"/>
  <text class="ink" x="124.0" y="141.0" font-size="14" font-weight="700" text-anchor="middle">grammar.ebnf</text>
  <text class="muted" x="124.0" y="160.0" font-size="12.5" text-anchor="middle">the vocabulary language</text>
  <rect class="panel" x="24" y="230" width="200" height="70" rx="10"/>
  <text class="ink" x="124.0" y="261.0" font-size="14" font-weight="700" text-anchor="middle">language.ebnf</text>
  <text class="muted" x="124.0" y="280.0" font-size="12.5" text-anchor="middle">the composition language</text>
  <rect class="process" x="270" y="110" width="280" height="70" rx="10"/>
  <text class="ink" x="410.0" y="141.0" font-size="14" font-weight="700" text-anchor="middle">architecture.csf</text>
  <text class="muted" x="410.0" y="160.0" font-size="12.5" text-anchor="middle">terms, sections, diagrams, north star</text>
  <rect class="process" x="270" y="230" width="280" height="70" rx="10"/>
  <text class="ink" x="410.0" y="261.0" font-size="14" font-weight="700" text-anchor="middle">csf/architecture/architecture.csf</text>
  <text class="muted" x="410.0" y="280.0" font-size="12.5" text-anchor="middle">processes, services, connections</text>
