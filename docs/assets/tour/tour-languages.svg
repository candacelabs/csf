  <text class="ink" x="868.0" y="283.0" font-size="14" font-weight="700" text-anchor="middle">generated</text>
  <text class="muted" x="868.0" y="302.0" font-size="12.5" text-anchor="middle">glossary, dictionary,</text>
  <text class="muted" x="868.0" y="318.0" font-size="12.5" text-anchor="middle">diagrams, north star</text>
