<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title description">
  <title id="title">The compiler's stages</title>
  <desc id="description">Five stages in order: parse, decode, validate, source check and emit. Under each, an example of input that stage rejects: a declaration missing its state field, a field the decoder cannot consume, a service declared with lifecycle borrowed, a subprocess launched from an undeclared file, and a changed generated byte.</desc>
  <!-- Hand-drawn tour figure in the style of docs/assets/csf-cpu0-mapping.svg; not generated from architecture.csf. -->
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #FFFFFF; }
    .ink { fill: #0F172A; }
    .muted { fill: #475569; }
    .accent { fill: #115E59; }
    .panel { fill: #EEF2FF; stroke: #4338CA; stroke-width: 2; }
    .card { fill: #FFFFFF; stroke: #64748B; stroke-width: 1.5; }
    .process { fill: #FFFFFF; stroke: #0F766E; stroke-width: 2.5; }
    .chip { fill: #0F766E; }
    .chip-text { fill: #FFFFFF; }
    .lithe { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
    .gate { fill: #FFFBEB; stroke: #B45309; stroke-width: 2; }
    .good { fill: #ECFDF5; stroke: #047857; stroke-width: 2; }
    .bad { fill: #FEF2F2; stroke: #B91C1C; stroke-width: 2; }
    .newchunk { fill: #0F766E; }
    .stored { fill: #E2E8F0; stroke: #94A3B8; stroke-width: 1; }
    .changed { fill: #D97706; }
    .wire { fill: none; stroke: #334155; stroke-width: 1.6; }
    .wire-head { fill: #334155; }
    .link { fill: none; stroke: #0F766E; stroke-width: 2; }
    .link-head { fill: #0F766E; }
    .dash { fill: none; stroke: #0F766E; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .badwire { fill: none; stroke: #B91C1C; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .bad-head { fill: #B91C1C; }
    .life { fill: none; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .tag-a { fill: #0F766E; }
    .tag-b { fill: #4338CA; }
    .tag-c { fill: #475569; }
    .reserved { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .band { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .tag-n { fill: #334155; }
    .own-csf { fill: #F0FDFA; stroke: #0F766E; stroke-width: 2.5; }
    .own-go { fill: #EEF2FF; stroke: #4338CA; stroke-width: 2; }
    .own-you { fill: #FFFBEB; stroke: #B45309; stroke-width: 2; }
    .own-hw { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
    .strip-you { fill: #FEF3C7; stroke: #B45309; stroke-width: 1; }
    .go-dot { fill: #4338CA; }
    .gowire { fill: none; stroke: #4338CA; stroke-width: 2; }
    .godash { fill: none; stroke: #4338CA; stroke-width: 2; stroke-dasharray: 6 4; }
    .go-head { fill: #4338CA; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1117; }
      .ink { fill: #E6EDF3; }
      .muted { fill: #9DA7B3; }
      .accent { fill: #5EEAD4; }
      .panel { fill: #1E1B4B; stroke: #818CF8; }
      .card { fill: #0D1117; stroke: #8B949E; }
      .process { fill: #0D1117; stroke: #2DD4BF; }
      .chip { fill: #115E59; }
      .lithe { fill: #161B22; stroke: #8B949E; }
      .gate { fill: #1F1A0E; stroke: #F59E0B; }
      .good { fill: #0B2018; stroke: #34D399; }
      .bad { fill: #2A1215; stroke: #F87171; }
      .newchunk { fill: #14B8A6; }
      .stored { fill: #21262D; stroke: #484F58; }
      .changed { fill: #F59E0B; }
      .wire { stroke: #9DA7B3; }
      .wire-head { fill: #9DA7B3; }
      .link { stroke: #2DD4BF; }
      .link-head { fill: #2DD4BF; }
      .dash { stroke: #2DD4BF; }
      .badwire { stroke: #F87171; }
      .bad-head { fill: #F87171; }
      .life { stroke: #484F58; }
      .tag-a { fill: #115E59; }
      .tag-b { fill: #3730A3; }
      .tag-c { fill: #30363D; }
      .reserved { fill: #161B22; stroke: #484F58; }
      .band { fill: #0D1117; stroke: #30363D; }
      .tag-n { fill: #30363D; }
      .own-csf { fill: #0B1F1E; stroke: #2DD4BF; }
      .own-go { fill: #1E1B4B; stroke: #818CF8; }
      .own-you { fill: #1F1A0E; stroke: #F59E0B; }
      .own-hw { fill: #161B22; stroke: #8B949E; }
      .strip-you { fill: #3A2A08; stroke: #F59E0B; }
      .go-dot { fill: #6366F1; }
      .gowire { stroke: #818CF8; }
      .godash { stroke: #818CF8; }
      .go-head { fill: #818CF8; }
    }
  </style>
  <defs>
    <marker id="wire-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wire-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="link-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="link-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="go-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="go-head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="bad-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="bad-head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="400" rx="16"/>
  <text class="ink" x="24" y="36" font-size="20" font-weight="700">csfc checks in five stages, and each one rejects something different.</text>
  <text class="muted" x="24" y="58" font-size="13">Adapted from the compiler walkthrough. Read left to right; the red boxes show what stops at each stage.</text>
  <rect class="process" x="24" y="90" width="170" height="116" rx="10"/>
  <rect class="chip" x="36" y="102" width="26" height="22" rx="11"/>
  <text class="chip-text" x="49.0" y="117.5" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text class="ink" x="72" y="119" font-size="15" font-weight="700">Parse</text>
  <text class="muted" x="38" y="152" font-size="12.5">Does the syntax fit</text>
  <text class="muted" x="38" y="169" font-size="12.5">the grammar?</text>
  <path class="link" d="M194,148 L216,148" marker-end="url(#link-end)"/>
  <path class="badwire" d="M109,206 L109,246" marker-end="url(#bad-end)"/>
  <rect class="bad" x="24" y="250" width="170" height="84" rx="10"/>
  <text class="ink" x="38" y="274" font-size="12.5" font-weight="700">rejected here</text>
  <text class="muted" x="38" y="296" font-size="12.5">a declaration missing</text>
  <text class="muted" x="38" y="313" font-size="12.5">its state field</text>
  <rect class="process" x="218" y="90" width="170" height="116" rx="10"/>
  <rect class="chip" x="230" y="102" width="26" height="22" rx="11"/>
  <text class="chip-text" x="243.0" y="117.5" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text class="ink" x="266" y="119" font-size="15" font-weight="700">Decode</text>
  <text class="muted" x="232" y="152" font-size="12.5">Can every field become</text>
  <text class="muted" x="232" y="169" font-size="12.5">a typed value?</text>
  <path class="link" d="M388,148 L410,148" marker-end="url(#link-end)"/>
  <path class="badwire" d="M303,206 L303,246" marker-end="url(#bad-end)"/>
  <rect class="bad" x="218" y="250" width="170" height="84" rx="10"/>
  <text class="ink" x="232" y="274" font-size="12.5" font-weight="700">rejected here</text>
  <text class="muted" x="232" y="296" font-size="12.5">a field the decoder</text>
  <text class="muted" x="232" y="313" font-size="12.5">cannot consume</text>
  <rect class="process" x="412" y="90" width="170" height="116" rx="10"/>
  <rect class="chip" x="424" y="102" width="26" height="22" rx="11"/>
  <text class="chip-text" x="437.0" y="117.5" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text class="ink" x="460" y="119" font-size="15" font-weight="700">Validate</text>
  <text class="muted" x="426" y="152" font-size="12.5">Do the declared</text>
  <text class="muted" x="426" y="169" font-size="12.5">relationships agree?</text>
  <path class="link" d="M582,148 L604,148" marker-end="url(#link-end)"/>
  <path class="badwire" d="M497,206 L497,246" marker-end="url(#bad-end)"/>
  <rect class="bad" x="412" y="250" width="170" height="84" rx="10"/>
  <text class="ink" x="426" y="274" font-size="12.5" font-weight="700">rejected here</text>
  <text class="muted" x="426" y="296" font-size="12.5">a service declared with</text>
  <text class="muted" x="426" y="313" font-size="12.5">lifecycle borrowed</text>
  <rect class="process" x="606" y="90" width="170" height="116" rx="10"/>
  <rect class="chip" x="618" y="102" width="26" height="22" rx="11"/>
  <text class="chip-text" x="631.0" y="117.5" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text class="ink" x="654" y="119" font-size="15" font-weight="700">Source check</text>
  <text class="muted" x="620" y="152" font-size="12.5">Do the Go files obey</text>
  <text class="muted" x="620" y="169" font-size="12.5">the declared policy?</text>
  <path class="link" d="M776,148 L798,148" marker-end="url(#link-end)"/>
  <path class="badwire" d="M691,206 L691,246" marker-end="url(#bad-end)"/>
  <rect class="bad" x="606" y="250" width="170" height="84" rx="10"/>
  <text class="ink" x="620" y="274" font-size="12.5" font-weight="700">rejected here</text>
  <text class="muted" x="620" y="296" font-size="12.5">a subprocess launched</text>
  <text class="muted" x="620" y="313" font-size="12.5">from an undeclared file</text>
  <rect class="process" x="800" y="90" width="170" height="116" rx="10"/>
  <rect class="chip" x="812" y="102" width="26" height="22" rx="11"/>
  <text class="chip-text" x="825.0" y="117.5" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text class="ink" x="848" y="119" font-size="15" font-weight="700">Emit</text>
  <text class="muted" x="814" y="152" font-size="12.5">typed declarations,</text>
  <text class="muted" x="814" y="169" font-size="12.5">diagram, obligations</text>
  <path class="badwire" d="M885,206 L885,246" marker-end="url(#bad-end)"/>
  <rect class="bad" x="800" y="250" width="170" height="84" rx="10"/>
  <text class="ink" x="814" y="274" font-size="12.5" font-weight="700">rejected here</text>
  <text class="muted" x="814" y="296" font-size="12.5">check-generated: one</text>
  <text class="muted" x="814" y="313" font-size="12.5">generated byte changed</text>
  <text class="muted" x="24" y="372" font-size="13">Passing one stage does not imply passing the next: each answers a different question.</text>
</svg>
