<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title description">
  <title id="title">gotth-live at a glance</title>
  <desc id="description">A browser tab holds the page, one delegated listener and the client runtime served by the application's own binary. One WebSocket per tab carries event frames up and patch frames down. Inside the application's Go process, gotth-live, part of CSF's web layer, runs one session goroutine per tab that owns that tab's state: it checks the event allowlist, calls Authorize and the pure Reduce, performs effects at the actor boundary, renders only dirty templ fragments and drops fragments whose bytes did not change. Widgets exist only inside gotth-live.</desc>
  <!-- Hand-drawn overview for pkg/gotth/README.md. The sequence diagram in that
       README's "One interaction, end to end" section is the authoritative
       step-by-step description; this figure only summarises it. -->
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #FFFFFF; }
    .ink { fill: #0F172A; }
    .muted { fill: #475569; }
    .accent { fill: #115E59; }
    .tab { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
    .process { fill: #EEF2FF; stroke: #4338CA; stroke-width: 2; }
    .library { fill: #FFFFFF; stroke: #0F766E; stroke-width: 2.5; }
    .step { fill: #0F766E; }
    .step-text { fill: #FFFFFF; }
    .yours { fill: #FFFBEB; stroke: #B45309; stroke-width: 1.5; }
    .widgets { fill: none; stroke: #0F766E; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .wire { fill: none; stroke: #334155; stroke-width: 1.8; }
    .wire-head { fill: #334155; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1117; }
      .ink { fill: #E6EDF3; }
      .muted { fill: #9DA7B3; }
      .accent { fill: #5EEAD4; }
      .tab { fill: #161B22; stroke: #8B949E; }
      .process { fill: #1E1B4B; stroke: #818CF8; }
      .library { fill: #0D1117; stroke: #2DD4BF; }
      .step { fill: #115E59; }
      .yours { fill: #1F1A0E; stroke: #F59E0B; }
      .widgets { stroke: #2DD4BF; }
      .wire { stroke: #9DA7B3; }
      .wire-head { fill: #9DA7B3; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="wire-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="420" rx="16"/>
  <text class="ink" x="24" y="36" font-size="19" font-weight="700">State and rendering stay in Go. The browser holds one socket per tab.</text>
  <text class="muted" x="24" y="58" font-size="12.5">Hand-drawn overview; the sequence diagram under “One interaction, end to end” is the step-by-step account.</text>

  <!-- Browser tab -->
  <rect class="tab" x="24" y="84" width="230" height="300" rx="12"/>
  <text class="ink" x="44" y="114" font-size="15" font-weight="700">Browser tab</text>
  <text class="muted" x="44" y="142" font-size="12">Server-rendered page</text>
  <text class="muted" x="44" y="162" font-size="12">One delegated listener</text>
  <text class="muted" x="44" y="182" font-size="12">Morph applies patches</text>
  <text class="muted" x="44" y="202" font-size="12">in place</text>
  <text class="accent" x="44" y="238" font-size="12" font-weight="600">Client runtime compiled into</text>
  <text class="accent" x="44" y="256" font-size="12" font-weight="600">your binary and served by the</text>
  <text class="accent" x="44" y="274" font-size="12" font-weight="600">same handler: no CDN, no npm</text>
  <text class="muted" x="44" y="310" font-size="12">No client-side reducer,</text>
  <text class="muted" x="44" y="328" font-size="12">no optimistic update</text>

  <!-- The socket -->
  <line class="wire" x1="258" y1="196" x2="332" y2="196" marker-end="url(#head)"/>
  <line class="wire" x1="332" y1="252" x2="258" y2="252" marker-end="url(#head)"/>
  <text class="muted" x="295" y="186" font-size="11" text-anchor="middle">event frame</text>
  <text class="muted" x="295" y="272" font-size="11" text-anchor="middle">patch frame</text>
  <text class="ink" x="295" y="228" font-size="11" font-weight="700" text-anchor="middle">1 WebSocket</text>

  <!-- The application's process -->
  <rect class="process" x="336" y="84" width="600" height="300" rx="14"/>
  <text class="ink" x="356" y="112" font-size="15" font-weight="700">Your application's Go process</text>

  <rect class="library" x="356" y="126" width="400" height="244" rx="12"/>
  <text class="ink" x="374" y="152" font-size="14" font-weight="700">gotth-live · part of CSF's web layer</text>
  <text class="muted" x="374" y="172" font-size="12">One session goroutine per tab, sole owner of its state</text>

  <rect class="step" x="374" y="186" width="176" height="38" rx="8"/>
  <text class="step-text" x="462" y="210" font-size="12" font-weight="600" text-anchor="middle">Events allowlist</text>
  <rect class="step" x="562" y="186" width="176" height="38" rx="8"/>
  <text class="step-text" x="650" y="210" font-size="12" font-weight="600" text-anchor="middle">Authorize</text>
  <rect class="step" x="374" y="234" width="176" height="38" rx="8"/>
  <text class="step-text" x="462" y="258" font-size="12" font-weight="600" text-anchor="middle">Reduce (pure)</text>
  <rect class="step" x="562" y="234" width="176" height="38" rx="8"/>
  <text class="step-text" x="650" y="258" font-size="12" font-weight="600" text-anchor="middle">Dirty fragments</text>
  <rect class="step" x="374" y="282" width="364" height="38" rx="8"/>
  <text class="step-text" x="556" y="306" font-size="12" font-weight="600" text-anchor="middle">Render templ fragments · drop unchanged bytes</text>

  <rect class="widgets" x="374" y="330" width="364" height="30" rx="8"/>
  <text class="accent" x="556" y="350" font-size="11.5" font-weight="600" text-anchor="middle">Widgets (pkg/widget) exist only inside gotth-live</text>

  <rect class="yours" x="772" y="126" width="148" height="112" rx="10"/>
  <text class="ink" x="846" y="154" font-size="13" font-weight="700" text-anchor="middle">Your code</text>
  <text class="muted" x="846" y="176" font-size="11.5" text-anchor="middle">reducer, fragments,</text>
  <text class="muted" x="846" y="194" font-size="11.5" text-anchor="middle">Authenticate,</text>
  <text class="muted" x="846" y="212" font-size="11.5" text-anchor="middle">Authorize</text>

  <rect class="yours" x="772" y="258" width="148" height="112" rx="10"/>
  <text class="ink" x="846" y="286" font-size="13" font-weight="700" text-anchor="middle">Your stores</text>
  <text class="muted" x="846" y="308" font-size="11.5" text-anchor="middle">reached by effects</text>
  <text class="muted" x="846" y="326" font-size="11.5" text-anchor="middle">the session performs</text>
  <text class="muted" x="846" y="344" font-size="11.5" text-anchor="middle">at the actor boundary</text>

  <line class="wire" x1="758" y1="253" x2="770" y2="253" marker-end="url(#head)"/>
  <line class="wire" x1="758" y1="182" x2="770" y2="182" marker-end="url(#head)"/>

  <text class="muted" x="24" y="408" font-size="11">Events are at-most-once; patches are exactly-once and in order. A session lives exactly as long as its connection.</text>
</svg>
