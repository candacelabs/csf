version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "schema/001_init.sql"
    queries: ["agent_configurations.sql", "cron.sql", "dispatch.sql", "jobs.sql", "queries.sql"]
    gen:
      go:
        package: "csfpg"
        out: "."
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
