    SubagentUpdatedEvent:
      type: object
      additionalProperties: false
      required: [seq, sessionId, kind, occurredAt, payload]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        sessionId: {type: string, format: uuid}
        kind: {type: string, enum: [subagentUpdated]}
        occurredAt: {type: string, format: date-time, pattern: 'Z$'}
        payload: {$ref: '#/components/schemas/Subagent'}

    SubagentActivityAppendedEvent:
      type: object
      additionalProperties: false
      required: [seq, sessionId, kind, occurredAt, payload]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        sessionId: {type: string, format: uuid}
        kind: {type: string, enum: [subagentActivityAppended]}
        occurredAt: {type: string, format: date-time, pattern: 'Z$'}
        payload: {$ref: '#/components/schemas/SubagentActivity'}

    HeartbeatEvent:
      type: object
      additionalProperties: false
      required: [seq, sessionId, kind, occurredAt]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        sessionId: {type: string, format: uuid}
        kind: {type: string, enum: [heartbeat]}
        occurredAt: {type: string, format: date-time, pattern: 'Z$'}

    AssistantDelta:
      type: object
      additionalProperties: false
      required:
        - turnId
        - text
      properties:
        turnId:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 65536

    SessionRequestKind:
      type: string
      enum:
        - permission

    SessionRequestStatus:
      type: string
      enum:
        - pending
        - approved
        - denied

    SessionRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - sessionId
        - kind
        - status
        - prompt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sessionId:
          type: string
          format: uuid
          readOnly: true
        turnId:
          type: string
          format: uuid
          readOnly: true
          description: The turn the request was raised in, when there is one.
        kind:
          $ref: '#/components/schemas/SessionRequestKind'
        status:
          $ref: '#/components/schemas/SessionRequestStatus'
        prompt:
          type: string
          minLength: 1
          maxLength: 65536
          description: What the CLI is asking, rendered for a human.
        toolName:
          type: string
          minLength: 1
          maxLength: 200
          description: Present on permission; the tool asking for it.
        createdAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
          description: RFC 3339 timestamp in UTC, ending in Z.
        resolvedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
          description: Absent while status is pending.

    SessionRequestList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionRequest'

    ResolveDecision:
      type: string
      description: A pending permission request accepts approve or deny.
      enum:
        - approve
        - deny
      x-enum-varnames:
        - Approve
        - Deny

    ResolveSessionRequestBody:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/ResolveDecision'

    AbortTurnRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, turnId]
      properties:
        idempotencyKey:
          type: string
          format: uuid
          description: Client-generated identity bound to this exact abort target.
        turnId:
          type: string
          format: uuid
          description: Exact active turn the client intends to stop.

    TerminalStatus:
      type: string
      description: starting and running are live; exited and failed are terminal.
      enum:
        - starting
        - running
        - exited
        - failed

    Terminal:
      type: object
      additionalProperties: false
      required:
        - id
        - worktreeId
        - status
        - shell
        - columns
        - rows
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        worktreeId:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/TerminalStatus'
        shell:
          type: string
          minLength: 1
          maxLength: 4096
          readOnly: true
          description: Configured executable; clients cannot select it.
        columns:
          type: integer
          format: int32
          minimum: 20
          maximum: 400
        rows:
          type: integer
          format: int32
          minimum: 5
          maximum: 200
        exitCode:
          type: integer
          format: int32
          readOnly: true
          description: Present after a normal process exit.
        createdAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true

    CreateTerminalRequest:
      type: object
      additionalProperties: false
      required:
        - columns
        - rows
      properties:
        columns:
          type: integer
          format: int32
          minimum: 20
          maximum: 400
        rows:
          type: integer
          format: int32
          minimum: 5
          maximum: 200

    ResizeTerminalRequest:
      type: object
      additionalProperties: false
      required:
        - columns
        - rows
      properties:
        columns:
          type: integer
          format: int32
          minimum: 20
          maximum: 400
        rows:
          type: integer
          format: int32
          minimum: 5
          maximum: 200

    TerminalInputRequest:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: string
          minLength: 1
          maxLength: 65536
          description: UTF-8 input written to the terminal's pseudo-terminal.

    TerminalEventKind:
      type: string
      enum:
        - output
        - exited
        - failed
        - heartbeat

    TerminalList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Terminal'

    TerminalEvent:
      type: object
      additionalProperties: false
      required:
        - seq
        - terminalId
        - kind
        - occurredAt
        - replayTruncated
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        terminalId:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/TerminalEventKind'
        occurredAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
        data:
          type: string
          maxLength: 65536
          description: UTF-8 output chunk; present only for output.
        exitCode:
          type: integer
          format: int32
          readOnly: true
          description: Present on exited.
        replayTruncated:
          type: boolean
          readOnly: true
          description: True on the first replayed event when older output was evicted.

    ChatScheduleStatus:
      type: string
      enum:
        - active
        - paused

    ChatScheduleRunStatus:
      type: string
      enum:
        - running
        - succeeded
        - failed
        - canceled
        - skipped

    ChatSchedule:
      type: object
      additionalProperties: false
      required:
        - id
        - sessionId
        - displayName
        - prompt
        - cronExpression
        - timezone
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sessionId:
          type: string
          format: uuid
          readOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 65536
        cronExpression:
          type: string
          minLength: 1
          maxLength: 1024
          description: Five-field expression validated by candace/pkg/cron.Raw.
        timezone:
          type: string
          minLength: 1
          maxLength: 200
          description: Portable IANA zone; Local is rejected.
        status:
          $ref: '#/components/schemas/ChatScheduleStatus'
        nextRunAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
          description: Absent while paused.
        lastRunAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
        lastRunStatus:
          $ref: '#/components/schemas/ChatScheduleRunStatus'
        lastError:
          type: string
          maxLength: 4096
          readOnly: true
          description: Human-readable failure or skip reason from the most recent occurrence.
        createdAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true

    ChatScheduleList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChatSchedule'

    CreateChatScheduleRequest:
      type: object
      additionalProperties: false
      required:
        - idempotencyKey
        - sessionId
        - displayName
        - prompt
        - cronExpression
        - timezone
      properties:
        idempotencyKey:
          type: string
          format: uuid
          description: |
            Stable identity for one create attempt. Exact retries return the
            original schedule; reusing the key for a different normalized
            request returns idempotency_key_reused.
        sessionId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 65536
        cronExpression:
          type: string
          minLength: 1
          maxLength: 1024
        timezone:
          type: string
          minLength: 1
          maxLength: 200

    UpdateChatScheduleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 65536
        cronExpression:
          type: string
          minLength: 1
          maxLength: 1024
        timezone:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ChatScheduleStatus'

    SubagentStatus:
      type: string
      enum:
        - active
        - completed
        - failed

    Subagent:
      type: object
      additionalProperties: false
      required:
        - id
        - sessionId
        - displayName
        - status
        - activityCount
        - startedAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: true
          description: Opaque identifier retained from the SDK or adapter seam.
        sessionId:
          type: string
          format: uuid
          readOnly: true
        turnId:
          type: string
          format: uuid
          readOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: true
        status:
          $ref: '#/components/schemas/SubagentStatus'
        summary:
          type: string
          maxLength: 65536
          readOnly: true
          description: Latest actual progress text, absent when none was reported.
        activityCount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        startedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
        completedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true

    SubagentList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Subagent'

    SubagentActivityKind:
      type: string
      enum:
        - started
        - progress
        - toolCall
        - toolResult
        - message
        - completed
        - failed

    SubagentActivity:
      type: object
      additionalProperties: false
      required:
        - seq
        - sessionId
        - subagentId
        - kind
        - occurredAt
        - text
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Monotonic, gapless position within this subagent.
        sessionId:
          type: string
          format: uuid
          readOnly: true
        subagentId:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: true
        kind:
          $ref: '#/components/schemas/SubagentActivityKind'
        occurredAt:
          type: string
          format: date-time
          pattern: 'Z$'
          readOnly: true
        text:
          type: string
          maxLength: 1048576
          description: Actual progress, message, arguments, output, or failure text.
        toolName:
          type: string
          minLength: 1
          maxLength: 200
        toolCallId:
          type: string
          minLength: 1
          maxLength: 200

    SubagentActivityPage:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubagentActivity'
        nextAfterSeq:
          type: integer
          format: int64
          minimum: 1

    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Stable machine-readable reason, such as session_not_found.
        message:
          type: string
          minLength: 1
          maxLength: 2048
        details:
          type: object
          description: Optional per-code context, such as the offending field.
          additionalProperties: true

    UsageObservation:
      type: object
      additionalProperties: false
      required: [kind]
      description: Source SDK usage; omitted fields are unknown. modelCall is incremental; sessionCheckpoint is cumulative.
      properties:
        kind:
          type: string
          enum: [modelCall, sessionCheckpoint]
        model:
          type: string
        apiCallId:
          type: string
        providerCallId:
          type: string
        serviceRequestId:
          type: string
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        cacheReadTokens:
          type: integer
          format: int64
          minimum: 0
        cacheWriteTokens:
          type: integer
          format: int64
          minimum: 0
        reasoningTokens:
          type: integer
          format: int64
          minimum: 0
        apiDurationMs:
          type: integer
          format: int64
          minimum: 0
        billingMultiplier:
          type: number
          format: double
          minimum: 0
          description: Provider model multiplier; not USD or premium request consumption.
        premiumRequests:
          type: number
          format: double
          minimum: 0
          description: Cumulative session premium requests explicitly reported by the provider.
        nanoAiu:
          type: number
          format: double
          minimum: 0
          description: Provider-reported nano AI units; incremental for modelCall and cumulative for sessionCheckpoint.

    SessionTelemetry:
      type: object
      additionalProperties: false
      required: [sessionId, displayName, model, status, createdAt, updatedAt, turnCount, knownStartedTurnCount, knownCompletedTurnCount, durationKnownTurnCount, observedModelCallCount, uncorrelatedUsageCount]
      properties:
        sessionId:
          type: string
          format: uuid
        displayName:
          type: string
        model:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        latestStartedAt:
          type: string
          format: date-time
        latestCompletedAt:
          type: string
          format: date-time
        latestUsageAt:
          type: string
          format: date-time
        latestTurnId:
          type: string
          format: uuid
        latestTurnStatus:
          type: string
        turnCount:
          type: integer
          format: int64
          minimum: 0
        knownStartedTurnCount:
          type: integer
          format: int64
          minimum: 0
        knownCompletedTurnCount:
          type: integer
          format: int64
          minimum: 0
        durationKnownTurnCount:
          type: integer
          format: int64
          minimum: 0
        observedModelCallCount:
          type: integer
          format: int64
          minimum: 0
        uncorrelatedUsageCount:
          type: integer
          format: int64
          minimum: 0
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        cacheReadTokens:
          type: integer
          format: int64
          minimum: 0
        cacheWriteTokens:
          type: integer
          format: int64
          minimum: 0
        reasoningTokens:
          type: integer
          format: int64
          minimum: 0
        apiDurationMs:
          type: integer
          format: int64
          minimum: 0
        durationSeconds:
          type: number
          format: double
          minimum: 0
        premiumRequests:
          type: number
          format: double
          minimum: 0

    TraceDeliveryCount:
      type: object
      additionalProperties: false
      required: [state, count]
      properties:
        state:
          type: string
          enum: [pending, running, accepted, failed]
          x-enum-varnames: [TracePending, TraceRunning, TraceAccepted, TraceFailed]
        count:
          type: integer
          format: int64
          minimum: 0

    TelemetrySnapshot:
      type: object
      additionalProperties: false
      required: [observedAt, sessions, traces]
      properties:
        observedAt:
          type: string
          format: date-time
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionTelemetry'
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceDeliveryCount'

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The resource is not in a state that allows this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: The host Copilot CLI could not be reached or rejected the call.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
