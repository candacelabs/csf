# Layout: sqlc emits one role-named file per concern (models.go, queries.sql.go)
# because a table's row and its queries belong together beside the schema.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries.sql"
    gen:
      go:
        package: "storedb"
        out: "../internal/storedb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
